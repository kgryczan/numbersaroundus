project:
  type: website
  output-dir: docs

website:
  title: "Numbers Around Us"
  site-url: "https://kgryczan.github.io/numbersaroundus/"
  description: "Practical writing about data science, business intelligence, data engineering, and the meaning behind the numbers."
  open-graph: true
  twitter-card: true
  search: false
  page-footer:
    left: "Numbers Around Us"
    center: "For everybody, not to be fooled by numbers."
    right: "Built with Quarto"
  navbar:
    title: "numbers around us"
    pinned: true
    left:
      - text: Writing
        href: last-articles.qmd
      - text: Topics
        menu:
          - text: Data Science
            href: ds/index.qmd
          - text: Business Intelligence
            href: bi/index.qmd
          - text: Data Philosophy
            href: dp/index.qmd
      - text: Practice
        href: challenges/index.qmd
      - text: About
        href: index.qmd#about
    right:
      - icon: github
        text: GitHub
        href: https://github.com/kgryczan

format:
  html:
    theme:
      dark: [darkly, styles/dark.scss]
      light: [cosmo, styles/light.scss]
    css: styles/nau.css
    include-after-body: _includes/site-scripts.html
    page-layout: article
    code-fold: true
    code-copy: true
    toc: true
    smooth-scroll: true
    highlight-style: github
