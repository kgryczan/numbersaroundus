name: Render and publish Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quarto-publish
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.37
      - name: Render website
        run: quarto render index.qmd last-articles.qmd ds/index.qmd bi/index.qmd dp/index.qmd challenges/index.qmd --no-execute
      - name: Commit rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/last-articles.html docs/ds/index.html docs/bi/index.html docs/dp/index.html docs/challenges/index.html docs/styles docs/scripts docs/site_libs
          git diff --cached --quiet || git commit -m "Render site"
          git push
